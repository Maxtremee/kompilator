name: kompilator
services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:10.9.4
    init: true
    read_only: true
    networks:
      - internal
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      API_URL: http://localhost:9000/
      API_AUTH_REQUIRED: 0
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - 8000:9000
      - 8001:9001
    environment:
      MINIO_ROOT_USER: ROOTUSER
      MINIO_ROOT_PASSWORD: CHANGEME123
    volumes:
      - minio_data:/data
  redis:
    image: redis:7.4.2
    networks:
      - internal
    ports:
      - 6400:6379
    restart: always
    volumes:
      - redis_data:/var/lib/redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  redis_data:
  minio_data:
networks:
  internal:
    driver: bridge
